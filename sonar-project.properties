# SonarQube Configuration
sonar.projectKey=devops-poc-app
sonar.projectName=DevOps POC Application
sonar.projectVersion=1.0.0

# Only analyze JavaScript/TypeScript source files
sonar.sources=app.js,server.js,src
sonar.exclusions=node_modules/**,coverage/**,.terraform/**,dist/**,public/**,helm/**,.github/**,terraform/**,**/*.test.js,jest.config.js,*.json,*.yaml,*.yml,*.html,*.css,Dockerfile

# Coverage - LCOV from Jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/node_modules/**,**/tests/**,**/*.test.js,jest.config.js,server.js,public/**

# JavaScript/TypeScript specific settings
sonar.language=js
sonar.sourceEncoding=UTF-8

# Duplication detection
sonar.cpd.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,public/**

# Test configuration
sonar.tests=tests
sonar.test.inclusions=**/*.test.js
sonar.test.exclusions=**/node_modules/**

# Disable analysis for non-code files
sonar.html.activate=false
sonar.css.activate=false
sonar.web.filePatterns=**/*.html
