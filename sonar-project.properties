# SonarQube Configuration
sonar.projectKey=devops-poc-app
sonar.projectName=DevOps POC Application
sonar.projectVersion=1.0.0
sonar.sources=.
sonar.exclusions=node_modules/**,coverage/**,.terraform/**,dist/**,**/*.test.js,jest.config.js

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/node_modules/**,**/tests/**,**/*.test.js,jest.config.js,server.js

# JavaScript/TypeScript
sonar.language=js

# Duplication
sonar.cpd.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Tests
sonar.tests=tests
sonar.test.inclusions=**/*.test.js

# Issue Links
sonar.externalIssuesReportPaths=coverage/junit.xml

# Performance
sonar.sourceEncoding=UTF-8
