# Staging Environment Overrides
replicaCount: 1

# Don't use imagePullSecrets - rely on Workload Identity
imagePullSecrets: []

environment: "staging"
logLevel: "debug"

# No autoscaling in staging
autoscaling:
  enabled: false

# Lighter resources for staging
resources:
  limits:
    cpu: 250m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Service configuration
service:
  type: LoadBalancer
  port: 80
  targetPort: 8080
