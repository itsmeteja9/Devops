replicaCount: 2

image:
  repository: us-central1-docker.pkg.dev/devops-poc-demo/hello-world-images/helm-demo
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  name: helm-demo-ksa

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "gce"
  annotations:
    kubernetes.io/ingress.global-static-ip-name: "helm-demo-ip"
  hosts:
    - host: helm-demo.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 256m
    memory: 256Mi
  requests:
    cpu: 128m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  - name: ENVIRONMENT
    value: "demo"
  - name: PORT
    value: "8080"

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 15
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
