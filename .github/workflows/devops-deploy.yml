name: DevOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GCP_REGION: us-central1
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  ARTIFACT_REGISTRY: docker-repo
  CLUSTER_NAME: devops-gke
  APP_NAME: devops-app
  APP_NAMESPACE: default
  DOCKER_IMAGE_NAME: devops-app

jobs:
  # Stage 1: Test & Quality Checks
  unit_tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests with coverage
        run: npm test

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: coverage/
          retention-days: 30

  sonarqube_scan:
    name: SonarQube Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate coverage reports
        run: npm run test:coverage
        continue-on-error: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download SonarScanner
        run: |
          curl -sSLo ~/sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.1.0.4477-linux-x64.zip
          unzip -o ~/sonar-scanner.zip -d ~/
          echo "$HOME/sonar-scanner-6.1.0.4477-linux-x64/bin" >> $GITHUB_PATH

      - name: Run SonarQube scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "⚠️ SonarQube not configured, skipping scan"
            exit 0
          fi

          sonar-scanner \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || 'devops-app' }} \
            -Dsonar.projectName=$APP_NAME \
            -Dsonar.organization=${{ vars.SONAR_ORG || 'devops' }} \
            -Dsonar.sources=. \
            -Dsonar.exclusions=node_modules/**,terraform/**,.github/**,tests/** \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.coverage.exclusions=**/node_modules/**,**/tests/**,**/*.test.js,jest.config.js,server.js \
            -Dsonar.host.url=$SONAR_HOST_URL \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.branch.name=${{ github.head_ref || github.ref_name }}

  terraform_validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform format check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Terraform init
        run: terraform -chdir=terraform init -input=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan (dry-run)
        run: terraform -chdir=terraform plan -input=false -lock=false 2>&1 | head -50

  # Stage 2: Build & Publish
  build_and_publish:
    name: Build & Publish Docker Image
    needs: [unit_tests, sonarqube_scan, terraform_validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write

    outputs:
      image_uri: ${{ steps.image.outputs.uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Create Artifact Registry repository
        run: |
          gcloud artifacts repositories create ${{ env.ARTIFACT_REGISTRY }} \
            --repository-format=docker \
            --location=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT_ID }} || true

      - name: Prepare image URI
        id: image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}"
          echo "uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "Image URI: ${IMAGE_URI}"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.image.outputs.uri }}" \
            --label "git.sha=${{ github.sha }}" \
            --label "git.ref=${{ github.ref }}" \
            .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.uri }}
          format: sarif
          output: trivy-results.sarif
        continue-on-error: true

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Push Docker image
        run: docker push "${{ steps.image.outputs.uri }}"

  # Stage 2.5: Create Infrastructure with Terraform
  terraform_apply:
    name: Create GCP Infrastructure
    needs: build_and_publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Terraform apply
        run: terraform -chdir=terraform apply -auto-approve -input=false
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.GCP_REGION }}

  # Stage 3: Deploy to GKE
  deploy_gke:
    name: Deploy to GKE
    needs: [build_and_publish, terraform_apply]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "latest"

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ env.APP_NAME }} ./helm \
            --namespace ${{ env.APP_NAMESPACE }} \
            --set image.repository="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}" \
            --set image.tag="${{ github.sha }}" \
            --wait=false

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${{ env.APP_NAME }} \
            --namespace ${{ env.APP_NAMESPACE }} \
            --timeout=5m

      - name: Configure Datadog monitoring
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY || '' }}
          DD_SITE: ${{ vars.DD_SITE || 'datadoghq.com' }}
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "⚠️ DD_API_KEY not configured, skipping Datadog setup"
            exit 0
          fi
          echo "📊 Configuring Datadog monitoring..."
          kubectl set env deployment/${{ env.APP_NAME }} \
            --namespace ${{ env.APP_NAMESPACE }} \
            DD_API_KEY="$DD_API_KEY" \
            DD_SITE="$DD_SITE" \
            DD_SERVICE="${{ env.APP_NAME }}" \
            DD_VERSION="${{ github.sha }}" \
            DD_TRACE_ENABLED="true" \
            DD_LOGS_ENABLED="true"

      - name: Display deployment info
        run: |
          echo "=== Helm Release ==="
          helm list -n ${{ env.APP_NAMESPACE }}

          echo ""
          echo "=== Kubernetes Resources ==="
          kubectl get all -n ${{ env.APP_NAMESPACE }}

          echo ""
          echo "=== Service External IP ==="
          kubectl get svc ${{ env.APP_NAME }} -n ${{ env.APP_NAMESPACE }}

  # Stage 4: PR Validation (Pull Requests Only)
  pr_validation:
    name: PR Validation
    needs: [unit_tests, sonarqube_scan, terraform_validate]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "latest"

      - name: Lint Helm chart
        run: helm lint ./helm/${{ env.APP_NAME }}

      - name: Template Helm chart
        run: |
          helm template ${{ env.APP_NAME }} ./helm/${{ env.APP_NAME }} \
            --namespace ${{ env.APP_NAMESPACE }} \
            --set image.repository="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY }}/${{ env.DOCKER_IMAGE_NAME }}" \
            --set image.tag="latest" > helm-manifest.yaml

          echo "✅ Helm manifest generated"
          head -50 helm-manifest.yaml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform plan (PR preview)
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform plan -input=false -lock=false 2>&1 | head -100
        continue-on-error: true

  # Stage 5: Summary
  pipeline_summary:
    name: Pipeline Summary
    needs: [unit_tests, sonarqube_scan, terraform_validate, build_and_publish, deploy_gke]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Pipeline Status
        run: |
          echo "✅ Unit Tests: ${{ needs.unit_tests.result }}"
          echo "✅ SonarQube: ${{ needs.sonarqube_scan.result }}"
          echo "✅ Terraform: ${{ needs.terraform_validate.result }}"
          echo "✅ Docker Build: ${{ needs.build_and_publish.result }}"
          echo "✅ GKE Deploy: ${{ needs.deploy_gke.result }}"
          echo ""
          echo "🚀 Pipeline complete! Check the Actions tab for details."
