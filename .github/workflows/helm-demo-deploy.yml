name: Helm Demo - Build and Deploy to GKE

on:
  push:
    branches:
      - main
    paths:
      - 'helm-demo/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY || 'hello-world-images' }}
  GKE_CLUSTER: hello-world-gke
  GKE_ZONE: ${{ vars.GCP_REGION || 'us-central1' }}-a
  DEPLOYMENT_NAME: helm-demo
  HELM_RELEASE: helm-demo

jobs:
  build_and_deploy:
    name: Build Docker image and deploy to GKE
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build container image
        run: |
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}/${DEPLOYMENT_NAME}:${GITHUB_SHA}"
          docker build --pull --tag "${IMAGE_URI}" ./helm-demo
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

      - name: Push container image
        run: |
          docker push "${IMAGE_URI}"

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${GKE_CLUSTER} \
            --zone ${GKE_ZONE} \
            --project ${GCP_PROJECT_ID}

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Create namespace if not exists
        run: |
          kubectl create namespace helm-demo --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to GKE with Helm
        run: |
          helm upgrade --install ${HELM_RELEASE} ./helm-demo/helm/helm-demo \
            --namespace helm-demo \
            --values helm-demo/helm/helm-demo/values.yaml \
            --set image.tag=${GITHUB_SHA} \
            --wait \
            --timeout 5m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/${DEPLOYMENT_NAME} \
            --namespace helm-demo \
            --timeout=5m

      - name: Display deployment info
        run: |
          echo "=== Helm Release Info ==="
          helm list -n helm-demo
          echo ""
          echo "=== Kubernetes Resources ==="
          kubectl get all -n helm-demo
